<style>
  .kmm-navbar-brand {
    margin-right: auto;
    padding-right: 1.5rem;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.25;
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
  }
  .kmm-navbar-brand:hover {
    text-decoration: none;
    opacity: .8;
  }
  @media (max-width: 767px) {
    .kmm-navbar-brand {
      font-size: .95rem;
      max-width: 13rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (document.querySelector('.kmm-navbar-brand')) return;

  var nav = document.querySelector('header nav');
  if (!nav) return;

  var brand = document.createElement('a');
  brand.className = 'kmm-navbar-brand';
  brand.href = '/';
  brand.textContent = 'Koshy Mammoottill Mathew';
  brand.setAttribute('aria-label', 'Koshy Mammoottill Mathew — Home');

  nav.insertBefore(brand, nav.firstChild);
});
</script>
