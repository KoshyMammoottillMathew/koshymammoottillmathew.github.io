name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Checkout BusinessDesk
        uses: actions/checkout@v4
        with:
          repository: KoshyMammoottillMathew/BusinessDesk
          path: businessdesk-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Local Tailwind CSS
        run: npm install tailwindcss @tailwindcss/cli

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.148.2'
          extended: true

      - name: Build Hugo Site
        run: hugo --gc --minify

      - name: Install BusinessDesk dependencies
        working-directory: businessdesk-source
        run: npm install

      - name: Build BusinessDesk
        working-directory: businessdesk-source
        run: npm run build

      - name: Add BusinessDesk to portfolio artifact
        run: |
          rm -rf public/products/businessdesk-kmm
          mkdir -p public/products/businessdesk-kmm
          cp -R businessdesk-source/dist/. public/products/businessdesk-kmm/

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
