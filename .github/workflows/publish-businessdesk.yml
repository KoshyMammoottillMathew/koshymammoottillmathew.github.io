name: Publish BusinessDesk by KMM

on:
  push:
    paths:
      - '.github/workflows/publish-businessdesk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio site
        uses: actions/checkout@v4

      - name: Checkout BusinessDesk
        uses: actions/checkout@v4
        with:
          repository: KoshyMammoottillMathew/BusinessDesk
          path: businessdesk-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: businessdesk-source/package-lock.json

      - name: Install dependencies
        working-directory: businessdesk-source
        run: npm ci

      - name: Build BusinessDesk
        working-directory: businessdesk-source
        run: npm run build

      - name: Publish compiled site
        run: |
          rm -rf products/businessdesk-kmm
          mkdir -p products/businessdesk-kmm
          cp -R businessdesk-source/dist/. products/businessdesk-kmm/
          touch products/businessdesk-kmm/.nojekyll
          rm -rf businessdesk-source

      - name: Commit production build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products/businessdesk-kmm
          if git diff --cached --quiet; then
            echo "Production build already current."
          else
            git commit -m "Publish BusinessDesk by KMM production build"
            git push
          fi
